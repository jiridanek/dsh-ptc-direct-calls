# Canonicalize stray model-direct calls into the equivalent run_code program,
# PTC sessions only: the declared view carries run_code and nothing outside the
# allowlist (every tool unless `tools` restricts it), and the live ptcRuntime
# must still accept a TypeScript async function body.
#
# Every tool is allowed by default; `run_code` itself is never rewritten.
# Add `config: { tools: [...] }` to restrict; that is also the only way for another
# plugin's direct tool to keep salvage alive on a restricted profile.
# Long-running tools such as workflow run under run_code's wall-clock ceiling
# once called directly (see DSH discussion #5822), so list them out if needed.
#
# In PTC prompt assemblies the plugin restates the shipped tools:ptc-only
# instruction and inserts a tools:direct-calls section telling the model to
# call a tool directly whenever its arguments would otherwise have to be
# escaped into a program (file contents, patches, code, and text with
# backticks, ${...}, quotes, or backslashes), naming write, edit, and bash explicitly.
- insert:
    - id: ptc-direct-calls
      name: dsh-ptc-direct-calls
