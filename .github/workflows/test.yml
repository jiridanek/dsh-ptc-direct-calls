name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # dsh requires Node >= 24.9.0; 24 is the LTS line and 26 the current one.
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      # Self-contained: the @deepseek-ai/schemastery import is stubbed by a
      # module-resolution hook (module.registerHooks), no dependencies to install.
      - run: npm test
      # The manifest is read by the dsh bundle loader and the plugin manager;
      # fail here rather than at profile boot.
      - run: node -e "JSON.parse(require('node:fs').readFileSync('package.json')); JSON.parse(require('node:fs').readFileSync('locale/en.json'))"
