name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node >= 20.6 (module.register); 22 and 24 are the LTS pair.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      # Self-contained: the @deepseek-ai/schemastery import is stubbed by a
      # module-resolution hook, no dependencies to install.
      - run: npm test
